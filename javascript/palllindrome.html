<!DOCTYPE html>
<html>
<body>
<input placeholder="enter number" id="dit"></input>
<button onclick="myFunction()">submit</button>
<p id="demo"></p>
<script>
function myFunction()
{
var org,n,temp=0,r=0;
n = document.getElementById("dit").value;
org=n;
while(n>0)
{
temp = n % 10;
r = r*10+ temp;
n= parseInt(n/10);

}
if(r==org)
{
//alert("palindrome");
document.getElementById("demo").innerHTML = "palindrome";
}
else
{
//alert("not palindrome");
document.getElementById("demo").innerHTML = "not palindrome";
}
}
</script>
</body>
</html>
