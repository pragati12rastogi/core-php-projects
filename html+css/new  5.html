<! doctype html>
<html>
<head>
<title>yahoo form</title>
<link href="formstyle.css" rel="stylesheet">
</head>
	<body>
	<center>
	<div class="new">
		<form action="https://login.yahoo.com/beta/?intl=in&.intl=in&specId=yidReg&.done=https%3A%2F%2Fwww.yahoo.com&nr=1">
		<div id="gra">
		</div>
		<div class="myform">
		<legend>Sign up</legend><br>
			<input type="text" name="name" placeholder="First name:" size="15" style="border:none;border-bottom:1px solid grey;margin:2%" required>
			<input type="text" name="name" placeholder="Last name:" size="15" style="border:none;border-bottom:1px solid grey;margin:2%" required>
			<br>
			<input type="text" placeholder="email address            @yahoo.com" name="email" size="37" style="border:none;border-bottom:1px solid grey;margin:2%" required><br>
			<p>I'd rather use my own email address</p>
			<input type="password" name="password" placeholder="Password" size="37" style="border:none;border-bottom:1px solid grey;margin:2%" required><br>
			<select id="sel" required/>
			<option value="+91" selected>India(+91)</option>
			<option value="+93">Afghanistan(+93)</option>
			<option value="+355">Albania(+355)</option>
			</select>
			<input type="tel" name="pno" placeholder="Mobile phone number" size="27" style="border:none;border-bottom:1px solid grey;margin:2%" required>
			<input list="month" placeholder="Birth Month" size="10" max-length="2" style="border:none;border-bottom:1px solid grey;margin:2%" required>
			<datalist id="month">
			<option value="january">
			<option value="february">
			<option value="march">
			<option value="April">
			<option value="may">
			<option value="june">
			<option value="july">
			<option value="august">
			<option value="september">
			<option value="october">
			<option value="november">
			<option value="december">
			</datalist>
			<input type="list" name="bm" placeholder="Day" size="4" style="border:none;border-bottom:1px solid grey;margin:2%" required>
			<!--<input type="date" name="date" placeholder="date" size="10" style="border:none;border-bottom:1px solid grey;">-->
			<input type="year" name="year" placeholder="year" size="8" max-length="4" style="border:none;border-bottom:1px solid grey;margin:2%" required>
			<input list="gender" placeholder="gender(optional)" size="37" style="border:none;border-bottom:1px solid grey;margin:2%" >
			<datalist id="gender">
			<option value="female">
			<option value="male">
			</datalist>
			<br>
			<input type="submit" class="button1" value="continue">
			<br>
			<br>
			<p class="sign">Already have an account?<span><a href="https://login.yahoo.com/?lang=en-US&.intl=in&specId=yidReg&.done=https%3A%2F%2Fwww.yahoo.com&nr=1">Sign in</a><span></p>
			<br>
			<br>
			<br>
			<footer><span style=color:#979ba7>I agree to the yahoo <span style=color:#188fff>Term</span> and </span><span style=color:#188fff>Privacy(Updated)</span></footer>
			</div>
			
		</form>
		</div>
		</center>
</body>
</html>
